---
- name: Configure web server
  hosts: web
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Stop host Nginx if installed
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove host Nginx package
      ansible.builtin.apt:
        name: nginx
        state: absent
        purge: true

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create web content directory
      ansible.builtin.file:
        path: /opt/web/
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy custom index page 
      ansible.builtin.copy:
        src: files/index.html
        dest: /opt/web/index.html
        owner: root
        group: root
        mode: "0644"   

    - name: Run Dockerized Nginx web container
      community.docker.docker_container:
        name: web-nginx
        image: nginx:alpine
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
        volumes:
          - /opt/web/index.html:/usr/share/nginx/html/index.html:ro

    - name: Remove old test Nginx container if present
      community.docker.docker_container:
        name: test-nginx
        state: absent               