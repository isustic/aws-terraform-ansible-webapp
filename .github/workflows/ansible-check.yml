name: Ansible check

on:
  workflow_dispatch:
  pull_request:
      paths:
        - "ansible/**"
        - ".  github/workflows/ansible-check.yml"
  push:
    branches:
      - main
    paths: 
      - "ansible/**"
      - "github/workflows/ansible-check.yml"  

jobs:
  ansible-check:
    name: Ansible syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: | 
          python -m pip install --upgrade pip
          pip install ansible

      - name: Check Ansible playbook syntax
        run: ansible-playbook -i ansible/invetory.ini.example --syntax-check ansible/playbook.yml    
